<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No More Illusions — Loading...</title>
  <script>
    // GitHub Pages SPA & Case-Insensitive Redirect Handler
    // Redirects lowercase (/nomoreillusions) or single-l (/NoMoreIlusions) to canonical PascalCase
    const canonical = "https://oneshelfstudio.github.io/NoMoreIllusions/";
    if (!window.location.href.startsWith(canonical)) {
      window.location.replace(canonical);
    }
  </script>
  <meta http-equiv="refresh" content="0; url=https://oneshelfstudio.github.io/NoMoreIllusions/">
  <style>
    body {
      margin: 0;
      background: #090615;
      color: #00f2fe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 242, 254, 0.2);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #ffd700;
      text-decoration: underline;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading No More Illusions...</h2>
  <p>If you are not redirected automatically, <a href="https://oneshelfstudio.github.io/NoMoreIllusions/">click here to launch</a>.</p>
</body>
</html>
